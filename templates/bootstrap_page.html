<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Страница с Bootstrap</title>
    <!-- Подключение Bootstrap 5 через CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h3 class="mb-0">Flask + Bootstrap</h3>
                    </div>
                    <div class="card-body">
                        <h5 class="card-title">Стильная страница</h5>
                        <p class="card-text">Эта страница сверстана с помощью популярного CSS-фреймворка Bootstrap. Здесь есть карточки, кнопки и адаптивная сетка.</p>
                        <button class="btn btn-success">Нажми меня</button>
                        <a href="#" class="btn btn-outline-secondary">Ссылка</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
